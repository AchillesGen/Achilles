name: Publish Achilles data set

# Attaches the packaged data set to a GitHub Release tagged `achilles-data-v*`.
# Data is versioned independently of the code (see ACHILLES_DATA_RELEASE in
# CMakeLists.txt); publish such a release only when the data/ tree changes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing data-release tag to attach assets to (e.g. achilles-data-v1)"
        required: true

permissions:
  contents: write

jobs:
  publish-data:
    # Only run for data releases, never for code releases.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'achilles-data-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data assets
        run: python scripts/package_data.py --out-dir dist

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/achilles-data.tar.gz \
            dist/achilles-data.tar.gz.sha256 \
            --clobber
