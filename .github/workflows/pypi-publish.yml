name: Upload Python Package to PyPI when a Release is Created

on:
  workflow_dispatch:
  release:
    types:
      - published
  pull_request:
    paths:
      - .github/workflows/pypi-publish.yml
  push:
    branches:
      - main

jobs:
  version:
    name: Compute package version
    # Data releases (achilles-data-v*) fire this trigger too; never publish those.
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # `git tag` below needs the full tag history
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            version="${RELEASE_TAG#v}"
            is_release=true
          else
            # Nightly. The v[0-9]* glob excludes achilles-data-v* tags.
            tags="$(git tag --list 'v[0-9]*' --sort=-v:refname)"
            base="$(TAGS="$tags" python3 - <<'EOF'
          import os, re
          # Bump the minor of the newest final so PEP 440 orders the nightly
          # 0.3.1 < 0.4.0.devYYYYMMDD < 0.4.0rc1 < 0.4.0; skip rc tags, no tags -> 0.1.0.
          for tag in os.environ["TAGS"].splitlines():
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag.strip())
              if match:
                  major, minor, _ = map(int, match.groups())
                  print(f"{major}.{minor + 1}.0")
                  break
          else:
              print("0.1.0")
          EOF
            )"
            version="${base}.dev$(date -u +%Y%m%d)"
            is_release=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version} (release: ${is_release})"

  build_wheels:
    name: Build wheels for ${{ matrix.os }}
    needs: [version]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
          # TODO: Figure out Windows wheels
          # - os: windows-intel
          #   runs-on: windows-latest
          # - os: windows-arm
          #   runs-on: windows-11-arm
          - os: macos-intel
            # macos-15-intel is the last x86_64 runner
            runs-on: macos-15-intel
          - os: macos-arm
            # macos-15 (including latest) are ARM64 runners
            runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Stamp version into pyproject.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, re
          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          patched, count = re.subn(
              r'(?m)^version = ".*"$', f'version = "{version}"', path.read_text(), count=1
          )
          if count != 1:
              raise SystemExit("no [project] version line found in pyproject.toml")
          path.write_text(patched)
          print(f"pyproject.toml version -> {version}")
          EOF

      # The build[uv] frontend needs uv on PATH
      - uses: astral-sh/setup-uv@v6

      # Pick a deterministic ccache dir on macOS so it matches what we cache.
      - name: Configure ccache dir (macOS)
        if: contains(runner.os, 'macos')
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Setup GFortran
        if: contains(runner.os, 'macos')
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 15

      # Persist the C/C++/Fortran object cache across CI runs.
      - name: Restore ccache (Linux)
        if: contains(runner.os, 'linux')
        uses: actions/cache@v4
        with:
          path: /tmp/achilles-ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-

      - name: Restore ccache (macOS)
        if: contains(runner.os, 'macos')
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Stamp version into pyproject.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, re
          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          patched, count = re.subn(
              r'(?m)^version = ".*"$', f'version = "{version}"', path.read_text(), count=1
          )
          if count != 1:
              raise SystemExit("no [project] version line found in pyproject.toml")
          path.write_text(patched)
          print(f"pyproject.toml version -> {version}")
          EOF

      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  pypi-publish:
    name: Publish to PyPI
    needs: [version, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/achillesgen
    permissions:
      id-token: write
    # Pull requests build and test the wheels but must never publish.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Same-day merges share a .devYYYYMMDD version; a release must never collide.
          skip-existing: ${{ needs.version.outputs.is_release != 'true' }}
