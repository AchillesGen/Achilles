version: 2

# Keeps the `uses:` pins in .github/workflows/ current. Takes effect once on main.
updates:
  - package-ecosystem: "github-actions"
    # "/" means .github/workflows/ for this ecosystem.
    directory: "/"
    schedule:
      interval: "weekly"
    # One grouped PR a week rather than one per action.
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["ci", "dependencies"]
    commit-message:
      prefix: "ci"
