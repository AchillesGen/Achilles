[build-system]
requires = ["scikit-build-core>=0.5"]
build-backend = "scikit_build_core.build"

[project]
name = "AchillesGen"
version = "0.3.0"
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]

[project.optional-dependencies]
mcp = ["mcp>=1.0", "pyyaml"]

[project.scripts]
achilles = "Achilles._cli:main"
achilles-mcp = "Achilles.mcp_server.server:main"

[tool.scikit-build]
cmake.args = [
    "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
    "-DACHILLES_ENABLE_PYTHON=ON",
    "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
    "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
    "-DCMAKE_Fortran_COMPILER_LAUNCHER=ccache",
]
cmake.source-dir = "."
sdist.include = ["data/**", "flux/**"]
# Drop the top-level lib/ that some CPM deps install themselves into (hardcoding
# lib/ and ignoring CMAKE_INSTALL_LIBDIR). The libraries we actually need are
# re-installed into Achilles/lib with correct rpaths.
wheel.exclude = ["lib/**"]

[tool.cibuildwheel]
build-frontend = "build[uv]"
build-verbosity = 1
# TODO: Perform robustness tests
# Ensure we can import Achilles
test-command = "python -c \"import Achilles; print(Achilles.__version__)\""
environment-pass = ["CCACHE_DIR"]
skip = ["*-musllinux*", "pp*", "cp3??t-*"]

[tool.cibuildwheel.linux]
before-all = [
    "yum install -y epel-release",
    "yum install -y hdf5-devel ccache",
]
environment = { CCACHE_DIR = "/host/tmp/achilles-ccache" }

[tool.cibuildwheel.macos]
before-all = "brew install hdf5 ccache"
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }

[tool.cibuildwheel.windows]
before-all = "vcpkg install hdf5:x64-windows"
