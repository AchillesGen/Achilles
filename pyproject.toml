[build-system]
requires = ["scikit-build-core>=0.5"]
build-backend = "scikit_build_core.build"

[project]
name = "Achilles"
version = "0.3.0"
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-v3"
license-files = ["LICENSE.md"]

[project.optional-dependencies]
mcp = ["mcp>=1.0", "pyyaml"]

[project.scripts]
achilles-mcp = "Achilles.mcp_server.server:main"

[tool.scikit-build]
cmake.args = ["-DCMAKE_POLICY_VERSION_MINIMUM=3.5", "-DACHILLES_ENABLE_PYTHON=ON"]
cmake.source-dir = "."
sdist.include = ["data/**", "flux/**"]

[tool.cibuildwheel]
test-groups = ["test"]
test-command = "pytest {project}/tests"
build-frontend = "build[uv]"
build-verbosity = 1
