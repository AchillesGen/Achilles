Main:
  NEvents: 100000
  HardCuts: true
  EventCuts: false
  DoRotate: false
  RunDecays: false
  Output:
      Format: HepMC3
      Name: electron_1300_37.hepmc
      Zipped: True

Processes:
- Model: DarkNeutrinoPortal_Dirac_UFO
  Final States: [11]
  ParamCard: parameters.dat

Options:
  Unweighting:
    Name: Percentile
    percentile: 99
  Initialize:
    Seed: 12345678
    Accuracy: 1e-2
    
Beams:
  - Beam:
      PID: 11
      Beam Params:
        Type: Monochromatic
        Energy: 1300

Cascade:
  Run: False
  Interaction:
    Name: GeantInteractions
    GeantData: data/GeantData.hdf5
  Step: 0.04
  Probability: Cylinder

NuclearModels:
  - NuclearModel:
      Model: QESpectral
      FormFactorFile: "FormFactors.yml"
      SpectralP: data/Spectral_Functions/pke12p_tot.data
      SpectralN: data/Spectral_Functions/pke12p_tot.data
      Ward: None

Nuclei:
  - Nucleus: !include "data/default/12C.yml"

HardCuts:
  - Type: AngleTheta
    PIDs: 11
    range: [35, 39]

Backend:
  Name: Default
  Options: []