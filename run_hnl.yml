Main:
  NEvents: 100000
  HardCuts: true
  EventCuts: false
  DoRotate: false
  Output:
      Format: HepMC3
      Name: electron_1300_37.hepmc
      Zipped: True

Process:
  Model: DarkNeutrinoPortal_Dirac_UFO
  Final States: [11]
  ParamCard: parameters.dat

Initialize:
  Seed: 12345678
  Accuracy: 1e-2

Unweighting:
  Name: Percentile
  percentile: 99

Beams:
  - Beam:
      PID: 11
      Beam Params:
        Type: Monochromatic
        Energy: { value: 1300, unit: MeV }

Cascade:
  Run: False
  Interaction:
    Name: GeantInteractions
    GeantData: data/GeantData.hdf5
  Step: { value: 0.04, unit: fm }
  Probability: Cylinder

NuclearModel:
  Model: QESpectral
  FormFactorFile: "FormFactors.yml"
  SpectralP: data/pke12_tot.data
  SpectralN: data/pke12_tot.data
  Ward: False

Nucleus:
  Name: 12C
  Binding: { value: 8.6, unit: MeV }
  Fermi Momentum: { value: 225, unit: MeV }
  Density:
    File: data/c12.prova.txt
    FilePotential: data/realOP_12C_EDAI.dat
    Function: configuration
    Config Type: QMC
  FermiGas: Local
  Potential: 
    Name: Schroedinger
    r0: 0.16
    Mode: 3

HardCuts:
  - Type: AngleTheta
    PIDs: 11
    range: [35, 39]
