# MINERvA low-energy antineutrino on CH, QE + virtual-resonance RES, for the CC1pi0
# antineutrino samples. The muon cut is 40 deg: the published selections for these
# samples cut the muon at 25 deg, so this contains them with margin while still keeping
# the generation off the wide-angle tail.
Main:
  NEvents: 7500000
  HardCuts: True
  EventCuts: false
  DoRotate: false
  RunDecays: False
  Output:
      Format: NuHepMC
      Name: MINERvA_CH_QE_RES_VirtResonances_antinu.hepmc
      Zipped: False

SherpaOptions: !include "data/default/SherpaOptions.yml"

Processes:
  - Leptons: [-14, [-13]]

Beams:
  - Beam:
      PID: -14
      Beam Params:
        Type: Spectrum
        Histogram: flux/minerva_numub_rhc.dat

Cascade:
  Run: True
  Interactions: !include "data/default/VirtResInteractions.yml"
  Step: 0.04
  Probability: Cylinder
  InMedium: None
  PotentialProp: False
  Algorithm: Base

NuclearModels:
 - NuclearModel:
    Model: FortranModel
    Name: QE_Spectral_Func
    ConfigFile: data/info_C12_pke.data
    FormFactorFile: "FormFactors.yml"
    Ward: None
 - NuclearModel:
    Model: FortranModel
    Name: RES_Spectral_Func
    ConfigFile: data/info_C12_pke.data
    FormFactorFile: "FormFactors.yml"
    Ward: None

Nuclei:
  - Nucleus: !include "data/default/12C.yml"
  - Nucleus: !include "data/default/1H.yml"

HardCuts:
  - Type: AngleTheta
    PIDs: -13
    range: [0., 40.]

Options: !include "data/default/OptionDefaults.yml"

Cache:
  Save: False
  Load: False

Backend:
  Name: Default
  Options: []
