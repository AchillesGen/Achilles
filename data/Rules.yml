Rules:
  - Type: RequiredFields
    Description: The fields that must be present in the run card.
    ErrorMessage: "The following fields are required: {}"
    Fields:
      - "Main/NEvents"
      - "Main/Output/Format"
      - "Main/Output/Name"
      - "Processes"
      - "NuclearModels"
      - "Nuclei"
      - "Cascade/Run"
      - "Options/Unweighting"
      - "Options/Initialize"

  - Type: ConditionalInteractionOption
    Description: Specific interactions require NucleonNucleon to have ResonanceMode set to Propagate.
    ErrorMessage: The interaction model {} requires NucleonNucleon to have ResonanceMode set to Propagate.
    Condition:
      Interactions:
        - DeltaInteraction
    Target:
      Name: NucleonNucleon
      RequiredOptions:
        ResonanceMode: Propagate

  - Type: ConditionalInteractionOption
    Description: Specific interactions require NucleonNucleon to have ResonanceMode set to Propagate.
    ErrorMessage: The interaction model {} requires NucleonNucleon to have ResonanceMode set to Propagate.
    Condition:
      Interactions:
        - PionInteraction
        - MesonBaryonInteraction
        - PionAbsorptionOneStep
    Target:
      Name: NucleonNucleon
      RequiredOptions:
        ResonanceMode: Decay

  - Type: RangeConstraint
    Description: The number of events must be greater than 0.
    ErrorMessage: "The number of events must be greater than 0."
    Path: Main/NEvents
    Optional: False
    Min: 1

  - Type: RangeConstraint
    Description: The cascade step size must be greater than 0.
    ErrorMessage: "The cascade step size must be greater than 0."
    Path: Cascade/Step
    Optional: False
    Min: 1e-8

  - Type: RangeConstraint
    Description: Ensure the exponential suppression is between 0.0 and 2.0.
    ErrorMessage: "The exponential suppression must be between 0.0 and 2.0."
    List: Cascade/Interactions
    Match:
      Name: [NucleonNucleon, DeltaInteraction]
    Parameter: Options/ExpSup
    Optional: True
    Min: 0.0
    Max: 2.0

  - Type: RangeConstraint
    Description: Integration accuracy must be between 0 and 1.
    ErrorMessage: "Integration accuracy must be between 0 and 1."
    Path: Options/Integrator/MultiChannel/Accuracy
    Optional: True
    Min: 0.0
    Max: 1.0

  - Type: RangeConstraint
    Description: The integrator sampling batch size must be at least 1.
    ErrorMessage: "The integrator batch size must be at least 1."
    Path: Options/Integrator/BatchSize
    Optional: True
    Min: 1

  - Type: RangeConstraint
    Description: Unweighting percentile must be between 0 and 100.
    ErrorMessage: "Unweighting percentile must be between 0 and 100."
    Path: Options/Unweighting/percentile
    Optional: True
    Min: 0.0
    Max: 100.0
