#
# Achilles physics-validation config.
#
# Measurements are grouped under the *experimental setup* they share. Achilles
# events are generated ONCE per experiment (one run card / beam+target) and reused
# across every measurement in that setup — only the NUISANCE3 processing differs
# per measurement. CI shards one job per experiment (the expensive, generation-bound
# axis); adding a measurement to an existing setup costs no extra generation.
#
# Experiment fields:
#   name          Identifier for the setup — the common prefix of its sample names;
#                 also the CI shard/job name.
#   achilles_run  Achilles run card for this setup, path relative to the repo root.
#                 Flux/data files referenced inside the card (flux/..., data/...) need
#                 no fixups here: Achilles' loader searches the CWD, $ACHILLES_PATH,
#                 $ACHILLES_DATA_DIR and the install tree's share/Achilles (see
#                 Filesystem::FindFile / FindFlux), so a flux file shipped in flux/
#                 resolves both from a source checkout and from an install.
#   data_per      Convention the published data uses: 'nucleon' or 'atom'. Achilles
#                 reports per ATOM, so a per-nucleon measurement is divided by
#                 target_nucleons and a per-atom one is left alone. Do not use
#                 NUISANCE's PerNucleon conversion: for a composite target it divides
#                 by the struck nucleus' A (12 for CH), not the 13 the data uses.
#   target_nucleons  Nucleons per target atom; required when data_per: nucleon.
#   dryrun        SyntheticAdapter generation params (--dry-run / self-test):
#                 feature_shift simulates a physics change; ignored by nuisance3.
#   measurements  Full NUISANCE3 sample names, run verbatim. A bare name is enough;
#                 use a mapping ({name: ..., dryrun: {nbins: N}}) only to override
#                 synthetic-adapter binning.

# Unweighting scan (`physval.py --unweighter-scan`).
#
# Unweighting is variance reduction, not physics: whatever cap a scheme picks, an
# event above it is kept with its excess weight, so every scheme must reproduce the
# same distributions and differ only in how much MC noise it carries per generated
# event. The scan therefore re-generates each experimental setup once per variant,
# compares every variant against `reference` with the same correlated chi-square the
# branch comparison uses (a flag here means a scheme is *biasing* the physics), and
# reports the efficiency each one bought.
#
#   reference   Variant every other one is compared against. The loosest cap in the
#               list is the right choice: it leaves the fewest events overweighted,
#               so it is the closest thing to an uncapped answer that still goes
#               through the normal normalisation path.
#   variants    name     label used in tables, plots and event-file names
#               options  the Options/Unweighting block, substituted verbatim
#
# `Name: None` is deliberately NOT the reference. It looks like the ideal one — keep
# every event with its weight, no cap, no bias — but its events come out of the
# NuHepMC writer normalised low by a large factor: `NoUnweighter::AcceptEvent`
# returns the raw weight where every capped scheme returns weight/cap, and
# `EventGen::GenerateSingleEvent` multiplies by the summed caps either way. Until
# that is reconciled, `None` is not on a comparable footing with the rest.
unweighting:
  reference: percentile-99.9
  variants:
    - name: percentile-99.9
      options: {Name: Percentile, percentile: 99.9}
    - name: percentile-99
      options: {Name: Percentile, percentile: 99}       # the shipped default
    - name: excess-1e-2
      options: {Name: Excess, epsilon: 0.01}
    - name: excess-1e-3
      options: {Name: Excess, epsilon: 0.001}
    - name: tailfrac-1e-2
      options: {Name: TailFraction, epsilon: 0.01}
    - name: tailfrac-1e-3
      options: {Name: TailFraction, epsilon: 0.001}

experiments:
  - name: MINERvA_CC0pinp_STV_XSec
    achilles_run: "examples/Minerva/run_MINERvA_virtresonances.yml"
    data_per: nucleon          # published as cm^2/nucleon
    target_nucleons: 13        # CH
    dryrun:
      feature_shift: 0.0        # synthetic: physics shift applied to feature events
    measurements:
      - MINERvA_CC0pinp_STV_XSec_1Ddalphat_nu
      - MINERvA_CC0pinp_STV_XSec_1Ddphit_nu
      - MINERvA_CC0pinp_STV_XSec_1Ddpt_nu
      - MINERvA_CC0pinp_STV_XSec_1Dpmu_nu
      - MINERvA_CC0pinp_STV_XSec_1Dpnreco_nu
      - MINERvA_CC0pinp_STV_XSec_1Dpprot_nu
      - MINERvA_CC0pinp_STV_XSec_1Dthmu_nu
      - MINERvA_CC0pinp_STV_XSec_1Dthprot_nu

  # CC1Mu1p / CC1Mu2p / CC1MuNp share MicroBooNE's numu+Ar beam+target, so one
  # generation serves all three sample families.
  - name: MicroBooNE_CC1Mu
    achilles_run: "examples/Microboone/run_uB_1mu_virtresonances.yml"
    data_per: atom             # published as cm^2/argon atom, NOT per nucleon
    target_nucleons: 40        # 40Ar (documented; not used when data_per: atom)
    dryrun:
      feature_shift: 0.0
    measurements:
      - MicroBooNE_CC1Mu1p_XSec_1DDeltaAlphaT_nu
      - MicroBooNE_CC1Mu1p_XSec_1DDeltaPhiT_nu
      # NOTE: this sample's χ²/ndof against data is not meaningful, and the ~0.4 GeV
      # offset in its overlay plot is not an Achilles problem. NUISANCE mixes units
      # in the δp_n reconstruction (MicroBooNE_CC1Mu1p_XSec_1D_nu.cxx:223, unchanged
      # on main as of f5f79db): MA/MAPrime and the muon/proton energies are in GeV
      # while the longitudinal momenta and |δp_T| stay in MeV, so
      #   R = MA + pL_mu + pL_p - E_mu - E_p
      # collapses to pL_mu + pL_p and δp_L to roughly half the longitudinal momentum
      # — ~0.4 GeV for BNB kinematics, whatever generator is fed in. The published
      # data is the real δp_n, so the two sides plot different quantities.
      # main-vs-branch compatibility (what the flag uses) is unaffected: both
      # predictions go through the same broken definition. Kept for that reason.
      - MicroBooNE_CC1Mu1p_XSec_1DDeltaPn_nu
      - MicroBooNE_CC1Mu1p_XSec_1DDeltaPT_nu
      - MicroBooNE_CC1Mu1p_XSec_1DDeltaPtx_nu
      - MicroBooNE_CC1Mu1p_XSec_1DDeltaPty_nu
      - MicroBooNE_CC1Mu1p_XSec_1DECal_nu
      - MicroBooNE_CC1Mu1p_XSec_1DMuonCosTheta_nu
      - MicroBooNE_CC1Mu1p_XSec_1DMuonMomentum_nu
      - MicroBooNE_CC1Mu1p_XSec_1DProtonCosTheta_nu
      - MicroBooNE_CC1Mu2p_XSec_1DDeltaPT_nu
      - MicroBooNE_CC1Mu2p_XSec_1DOpening_Angle_Mu_Both_nu
      - MicroBooNE_CC1Mu2p_XSec_1DOpening_Angle_Protons_Lab_nu
      - MicroBooNE_CC1MuNp_XSec_1Dcosmu_nu
      - MicroBooNE_CC1MuNp_XSec_1Dcosp_nu
      - MicroBooNE_CC1MuNp_XSec_1DPmu_nu
      - MicroBooNE_CC1MuNp_XSec_1DPp_nu
      - MicroBooNE_CC1MuNp_XSec_1Dthetamup_nu

  # CC0pinp / CC1pipNp share T2K's numu+CH beam+target.
  - name: T2K_CC
    achilles_run: "examples/T2K/run_T2K_virtresonances.yml"
    data_per: nucleon          # published as cm^2/nucleon
    target_nucleons: 13        # CH
    dryrun:
      feature_shift: 0.0
    measurements:
      - T2K_CC0pinp_STV_XSec_1Ddat_nu
      - T2K_CC0pinp_STV_XSec_1Ddphit_nu
      - T2K_CC0pinp_STV_XSec_1Ddpt_nu
      - T2K_CC1pipNp_CH_XSec_1DdaT_nu
      - T2K_CC1pipNp_CH_XSec_1DdpTT_nu
      - T2K_CC1pipNp_CH_XSec_1DpN_nu
